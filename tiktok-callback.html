<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17 Cookup — Conectar TikTok</title>
<style>
  body{margin:0;font:16px/1.6 -apple-system,Helvetica,Arial,sans-serif;background:#0e0e10;color:#eee;
       display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:560px;padding:32px;text-align:center}
  h1{font-size:20px}
  code{display:block;background:#17171b;border:1px solid #2a2a31;border-radius:10px;padding:14px;
       margin:12px 0;word-break:break-all;color:#ff9a4a;font-size:13px}
  .mut{color:#9a9aa5;font-size:14px}
  a{color:#ff7a1a;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>Conectando TikTok…</h1>
  <p class="mut" id="msg">Enviando el código al editor…</p>
  <div id="fallback" style="display:none">
    <p class="mut">Si no se conecta solo, copia este código y pégalo en el editor:</p>
    <code id="code">—</code>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code') || '';
  const err = params.get('error');
  if (err) {
    document.getElementById('msg').textContent = 'Error de TikTok: ' + err + ' — ' + (params.get('error_description')||'');
  } else if (code) {
    // Rebota el código al servidor local (intercambio instantáneo, sin copiar/pegar)
    location.href = 'http://localhost:8765/tiktok/callback?code=' + encodeURIComponent(code);
    // Fallback por si el editor no está encendido
    setTimeout(() => {
      document.getElementById('msg').textContent = '¿No se conectó?';
      document.getElementById('fallback').style.display = 'block';
      document.getElementById('code').textContent = code;
    }, 2500);
  } else {
    document.getElementById('msg').textContent = 'No se recibió ningún código.';
  }
</script>
</body>
</html>
