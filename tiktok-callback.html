<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17 Cookup — Conectar TikTok</title>
<style>
  body{margin:0;font:16px/1.6 -apple-system,Helvetica,Arial,sans-serif;background:#0e0e10;color:#eee;
       display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:640px;padding:32px}
  h1{font-size:20px;text-align:center}
  .lbl{color:#9a9aa5;font-size:13px;margin-top:16px}
  code{display:block;background:#17171b;border:1px solid #2a2a31;border-radius:10px;padding:14px;
       margin:6px 0;word-break:break-all;color:#ff9a4a;font-size:13px}
  button{background:#ff7a1a;color:#111;border:0;border-radius:8px;padding:12px 20px;font-size:15px;
         font-weight:700;cursor:pointer;margin-top:8px}
  .ok{color:#3ddc84;margin-top:8px;min-height:20px}
  .mut{color:#9a9aa5;font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>Conexión con TikTok</h1>
  <div class="lbl">TU CÓDIGO (cópialo y pégalo en el editor / chat):</div>
  <code id="code">—</code>
  <button id="copy">Copiar código</button>
  <p class="ok" id="ok"></p>
  <div class="lbl">Diagnóstico (por si el código falla, copia también esto):</div>
  <code id="raw">—</code>
</div>
<script>
  const search = location.search;
  const params = new URLSearchParams(search);
  const code = params.get('code') || '';
  const err = params.get('error');
  document.getElementById('code').textContent = err ? ('ERROR: ' + err + ' — ' + (params.get('error_description')||'')) : (code || 'No se recibió código');
  document.getElementById('raw').textContent = 'search=' + search;
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById('ok').textContent = 'Copiado ✓'; }
    catch(e){ document.getElementById('ok').textContent = 'Selecciónalo y cópialo a mano.'; }
  };
</script>
</body>
</html>
